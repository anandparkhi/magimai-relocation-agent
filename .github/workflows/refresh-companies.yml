name: refresh-companies
on:
  schedule:
    - cron: "0 1 * * 0"        # Sundays 06:30 IST
  workflow_dispatch:
concurrency:
  group: agent-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: relocation-agent refresh-companies
      - name: Persist state
        run: |
          git config user.name "relocation-agent[bot]"
          git config user.email "relocation-agent[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore(state): refresh companies $(date -u +%FT%TZ)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
