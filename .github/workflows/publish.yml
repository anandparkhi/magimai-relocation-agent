name: publish
on:
  schedule:
    - cron: "*/20 3-12 * * *"  # every 20 min, 08:30–18:00 IST; cap of 10/day is enforced in code
  workflow_dispatch:
concurrency:
  group: agent-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Publish next queued job
        env:
          PUBLISHERS: ${{ vars.PUBLISHERS || 'dryrun' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: relocation-agent publish
      - name: Persist state
        run: |
          git config user.name "relocation-agent[bot]"
          git config user.email "relocation-agent[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore(state): publish $(date -u +%FT%TZ)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
